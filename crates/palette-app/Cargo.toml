[package]
name = "palette-app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

[dependencies]
anyhow.workspace = true
global-hotkey = "0.7"
gpui = { git = "https://github.com/dwrekofc/zed", rev = "82d88a45b46e82c5da466fed44cc96375984cc4b", features = ["runtime_shaders"] }
palette-core = { path = "../palette-core" }
palette-protocol = { path = "../palette-protocol" }
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2.7"

[[bin]]
name = "ableton-command-palette"
path = "src/main.rs"
